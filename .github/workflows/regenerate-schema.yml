name: Regenerate dashboard data and build

on:
  push:
    branches: [main]
    paths:
      - 'udm_schema.json'
      - 'udm_schema_v2.json'
      - 'scripts/generate_dashboard_data.py'
      - 'scripts/validate_schema.py'
      - 'scripts/check_spec_sync.py'
      - 'scripts/check_conformance.py'
      - 'schemas/**'
      - 'vignettes/udm-v2-system-of-record.md'
      - 'vignettes/modules/**'
      - 'dashboard/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Validate schema structure and referential integrity
        run: python scripts/validate_schema.py

      - name: Check prose spec / JSON sync
        run: python scripts/check_spec_sync.py

      - name: Check the specification conforms to itself
        run: python scripts/check_conformance.py --self-check

      - name: Generate dashboard data files from udm_schema_v2.json
        run: python scripts/generate_dashboard_data.py

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Build dashboard
        run: cd dashboard && npm run build

      - name: Commit updated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Auto-regenerate dashboard from udm_schema_v2.json"
          git push
