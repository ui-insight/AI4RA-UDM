name: Build and deploy the dashboard

on:
  push:
    branches: [main]
    paths:
      - 'udm_schema.json'
      - 'glossary.json'
      - 'VERSION'
      - 'README.md'
      - 'scripts/generate_dashboard_data.py'
      - 'scripts/generate_glossary.py'
      - 'scripts/check_glossary.py'
      - 'scripts/generate_allowed_values_doc.py'
      - 'vignettes/allowedvalues.md'
      - 'scripts/validate_schema.py'
      - 'scripts/check_spec_sync.py'
      - 'scripts/check_conformance.py'
      - 'schemas/**'
      - 'vignettes/udm-system-of-record.md'
      - 'vignettes/modules/**'
      - 'dashboard/**'
      - 'docs/**'
      - '.github/workflows/regenerate-schema.yml'
  # Pull requests run every check and the build, and never deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

# The site is deployed from this workflow, not from a branch. Nothing is
# committed: the build output is uploaded as a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Validate schema structure and referential integrity
        run: python scripts/validate_schema.py

      - name: Check prose spec / JSON sync
        run: python scripts/check_spec_sync.py

      - name: Check the specification conforms to itself
        run: python scripts/check_conformance.py --self-check

      - name: Check the glossary against the schema
        run: python scripts/check_glossary.py

      - name: Check the allowed values document against the schema
        run: python scripts/generate_allowed_values_doc.py --check

      - name: Generate dashboard data files from udm_schema.json
        run: python scripts/generate_dashboard_data.py

      - name: Generate the glossary outputs
        run: python scripts/generate_glossary.py

      - name: Generate DDL and seed rows for every mapped dialect
        run: |
          mkdir -p docs/ddl
          for d in $(python scripts/generate_ddl.py --list-dialects); do
            python scripts/generate_ddl.py --dialect "$d" > "docs/ddl/udm.$d.sql"
            python scripts/generate_ddl.py --dialect "$d" --all-modules > "docs/ddl/udm.$d.all-modules.sql"
            python scripts/generate_seed.py --dialect "$d" > "docs/ddl/udm.$d.seed.sql"
            python scripts/generate_seed.py --dialect "$d" --all-modules > "docs/ddl/udm.$d.all-modules.seed.sql"
          done

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Build dashboard
        run: cd dashboard && npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
